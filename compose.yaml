name: rockets

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rockets
      POSTGRES_PASSWORD: rockets
      POSTGRES_DB: rockets
    ports:
      - "${ROCKETS_PG_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockets -d rockets"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot schema migration. Services that need the schema declare:
  #   depends_on: { migrate: { condition: service_completed_successfully } }
  migrate:
    build: .
    image: rockets:dev
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://rockets:rockets@postgres:5432/rockets?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Stateless API servers; nginx below is the only published entry point.
  server:
    build: .
    image: rockets:dev
    command: ["server"]
    environment:
      DATABASE_URL: postgres://rockets:rockets@postgres:5432/rockets?sslmode=disable
    deploy:
      replicas: 3
    # Longer than the server's 15 s shutdown timeout; Docker's default is 10 s.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Inbox processors: claim disjoint batches (FOR UPDATE SKIP LOCKED); no ports.
  processor:
    build: .
    image: rockets:dev
    command: ["processor"]
    environment:
      DATABASE_URL: postgres://rockets:rockets@postgres:5432/rockets?sslmode=disable
    deploy:
      replicas: 4
    # Longer than the processor's 15 s shutdown timeout; Docker's default is 10 s.
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine   # >= 1.27.3 for "resolve" in upstream
    ports:
      - "8088:8088"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:

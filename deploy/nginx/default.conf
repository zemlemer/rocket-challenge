# Entry point on :8088: round-robin over the server replicas.
# deploy/nginx/ is mounted as /etc/nginx/conf.d/ (http context). A directory,
# not a single file: editors replace files, which a file bind mount would miss.

# Docker's embedded DNS; re-resolve so restarted replicas rejoin.
resolver 127.0.0.11 valid=5s ipv6=off;

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                    'upstream_status=$upstream_status time=$request_time';

upstream api {
    zone api 64k;                                   # required by "resolve"
    server server:8088 resolve max_fails=1 fail_timeout=5s;

    # Reuse connections to the servers; close idle ones before the server's
    # own IdleTimeout (60 s) so nginx never reuses a connection being closed.
    keepalive 32;
    keepalive_timeout 50s;
}

server {
    listen 8088;

    # Here, not in http context: a server-level access_log replaces the image's
    # http-level "main" log, so each request is logged once.
    access_log /var/log/nginx/access.log upstream;

    # Intake records the size violation after receiving the complete body.
    client_max_body_size 0;

    # Shared by all locations below (proxy_pass is not inherited).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 1s;

    location / {
        proxy_pass http://api;
        # Retry on another replica, POST included: intake keeps one copy per
        # message identity. Works only because the request body is buffered
        # (proxy_request_buffering on, the default).
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    }

    # Reads: a 503 here means the database is slow or down, which no other
    # replica can fix. Retrying it would make the client wait for every
    # replica's 5 s read timeout in turn and repeat the query against the
    # struggling database. Connection failures are still retried.
    location /rockets {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502;
    }

    # The stats report is a read too: same rule as /rockets.
    location /stats {
        proxy_pass http://api;
        proxy_next_upstream error timeout http_502;
    }
}
